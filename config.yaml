# EVE Market 插件配置
# 将此配置添加到 AstrBot 的 config.yaml 中的 plugins 部分

eve_market:
  # 数据库文件路径（可选，留空则使用 AstrBot 标准插件数据目录
  # data/plugin_data/eve_market/eve_items.db）
  db_path: ""

  # 每天自动更新物品数据的时刻（HH:MM 格式）
  # 默认 "05:07"（凌晨低峰时段）
  # 留空 "" 表示禁用自动更新
  # （旧配置 auto_update_interval: 0 同样表示禁用）
  auto_update_time: "05:07"

  # 自动更新失败后的重试间隔（分钟）
  # 到达设定时刻更新失败时，会在该间隔后重试一次
  update_retry_minutes: 30

  # 搜索结果最大数量
  max_search_results: 6

  # 是否启用模糊搜索
  fuzzy_match: true

  # 模糊搜索模式
  # contains: 包含匹配（默认）
  # starts_with: 前缀匹配
  # ends_with: 后缀匹配
  fuzzy_pattern: "contains"

  # 模糊搜索可信度最低阈值（百分比）
  # 非连续子串匹配的可信度低于此值的结果将被过滤
  min_confidence: 50
