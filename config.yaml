# EVE Market 插件配置
# 将此配置添加到 AstrBot 的 config.yaml 中的 plugins 部分

eve_market:
  # 数据库文件路径（可选，留空则使用 AstrBot 标准插件数据目录
  # data/plugin_data/eve_market/eve_items.db）
  db_path: ""

  # 每天自动更新物品数据的时刻（HH:MM 格式）
  # 默认 "05:07"（凌晨低峰时段）
  # 留空 "" 表示禁用自动更新
  # （旧配置 auto_update_interval: 0 同样表示禁用）
  auto_update_time: "05:07"

  # 自动更新失败后的重试间隔（分钟）
  # 到达设定时刻更新失败时，会在该间隔后重试一次
  update_retry_minutes: 30

  # 每日维护监控（晨曦/曙光每天 11:00 例行维护）
  # 监控窗口内检测到服务器离线后恢复在线时，向指定群聊推送开服消息
  # 每服每天只推送一次；到窗口结束仍未恢复则静默结束
  maintenance_monitor_enabled: true
  # 推送群号列表（aiocqhttp 平台），留空则不启用监控
  maintenance_notify_groups: ["123456789"]
  # 监控窗口（HH:MM）
  maintenance_check_start: "11:01"
  maintenance_check_end: "15:00"
  # 检查间隔（分钟）
  maintenance_check_interval: 1

  # 搜索结果最大数量
  max_search_results: 6

  # 是否启用模糊搜索
  fuzzy_match: true

  # 模糊搜索模式
  # contains: 包含匹配（默认）
  # starts_with: 前缀匹配
  # ends_with: 后缀匹配
  fuzzy_pattern: "contains"

  # 模糊搜索可信度最低阈值（百分比）
  # 非连续子串匹配的可信度低于此值的结果将被过滤
  min_confidence: 50
